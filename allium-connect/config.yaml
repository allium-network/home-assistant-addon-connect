name: Allium Connect (Home Node)
description: Reach Home Assistant, and anything else on your home network, from anywhere. No open ports, end-to-end encrypted.
slug: allium-connect
url: https://allium.network/connect
version: 0.3.2
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: true
# The WireGuard data path needs a TUN device + NET_ADMIN (route/address setup).
# Without them the node still registers, heartbeats and contributes — it just
# can't route mesh traffic, which defeats the point — so declare both.
privileged:
  - NET_ADMIN
devices:
  - /dev/net/tun
# Status page in the HA sidebar, served over the authenticated ingress only (the
# binary answers just the Supervisor's ingress proxy). Read-only:
# every setting lives in the Configuration tab.
ingress: true
ingress_port: 8099
panel_icon: mdi:home-export-outline
panel_title: Allium Connect
# No hassio_api: run.sh's one Supervisor call (/addons/self/info, for the slug
# the status page links with) is open to every add-on without it.
# Home Assistant API access, used for ONE thing: keeping a single Allium
# notification in HA's bell current ("set this External URL in the app", "your
# token no longer works"). The code only ever calls
# persistent_notification.create / .dismiss.
homeassistant_api: true
# Option keys never change between versions: a renamed key would silently drop
# what people already chose. Order = order in the Configuration tab. The four
# everyday choices have defaults (always shown); the rest are optional (`?`) and
# sit under "Show unused optional configuration options" until someone sets them.
options:
  connect_token: ""
  device_name: home-assistant
  advertise_exit: false
  snowflake: false
schema:
  connect_token: password
  device_name: str
  advertise_exit: bool
  snowflake: bool
  # ── Advanced (hidden until used) ──
  # exit_tor: also detour .onion sites through a local Tor client (implies the
  # Home exit; your ISP then sees Tor connections). Same-account only.
  exit_tor: bool?
  # relay_contribute: serve as a relay for OTHER accounts. Only does anything
  # when this box is reachable from the internet, which a normal home with no
  # open ports is not. Unset = off (run.sh exports an explicit false).
  relay_contribute: bool?
  # middle_node: a public Tor relay; needs 9001/tcp mapped below.
  middle_node: bool?
  # host_domains: serve this account's public domains from this box. Unset = on.
  # Turn OFF when another always-on node (e.g. a NAS home node) is the real host.
  host_domains: bool?
  # contribute_home: status-label override only ("relay on home network too");
  # kept so existing configs still validate. Unset = on.
  contribute_home: bool?
  # service_upstream: where registered services listen, when not on this box.
  service_upstream: str?
ports:
  9001/tcp: null
ports_description:
  9001/tcp: Tor relay port — only needed if you turn on "Run a Tor relay"
