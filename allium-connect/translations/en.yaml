configuration:
  connect_token:
    name: Connect token
    description: >-
      Links this add-on to your Allium account. Get one at allium.network:
      Dashboard → Network → Add a headless device. Paste it once; the add-on
      remembers it, so you can clear this field after the first start.
  device_name:
    name: Device name
    description: How this Home Assistant box is named in your Allium devices.
  advertise_exit:
    name: Use your home internet when away
    description: >-
      Lets your phone and laptop send all their internet traffic through your
      home connection, so you browse as if you were at home. Only your own
      devices can use it. This is not anonymity: your internet provider still
      sees the traffic. Off by default.
  snowflake:
    name: Help censored users (Tor Snowflake)
    description: >-
      Lends a little bandwidth to people in countries that block the internet,
      helping them reach Tor. Your IP is not listed publicly and nobody's
      traffic leaves the internet from your home. Uses at most the monthly data
      cap from your dashboard (Contribution card). Off by default.
  exit_tor:
    name: Open .onion sites through home (advanced)
    description: >-
      Also sends .onion addresses through a Tor client on this box, so your
      devices can open onion sites without their own Tor app. Turns on "Use
      your home internet when away". Your internet provider then sees Tor
      connections from your home.
  relay_contribute:
    name: Relay for other Allium users (advanced)
    description: >-
      Forwards other accounts' encrypted traffic, which this box can never read,
      when their devices can't connect directly. Only works if this box is
      reachable from the internet, which a normal home without open ports is
      not; otherwise it does nothing. Off unless you turn it on.
  middle_node:
    name: Run a Tor relay (advanced)
    description: >-
      Runs a public Tor middle relay. Your home IP appears in Tor's public relay
      list, and you must map port 9001/tcp in the Network section below. Only
      turn this on if you understand what that means.
  host_domains:
    name: Host my public websites here (advanced)
    description: >-
      Serves your account's public domains (and .onion publishes) from this box.
      On unless you turn it off. Turn it off if another always-on device, like a
      NAS, is where your websites actually run.
  contribute_home:
    name: Show sharing as active at home (advanced)
    description: >-
      Kept for older setups; it only changes the status shown in the log. It
      does not switch any sharing on or off. Leave it alone.
  service_upstream:
    name: Where your services run (advanced)
    description: >-
      Leave empty. Home Assistant on this box is found automatically. Fill in an
      IP address only if the status page says a service you added can't be
      reached, because it runs on another machine.
